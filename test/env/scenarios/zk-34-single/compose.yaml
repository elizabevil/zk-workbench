name: zkui-zk-34-single

services:
  zk:
    image: zookeeper:3.4.14
    container_name: zkui-zk-34-single
    ports:
      - "2183:2181"
    environment:
      ZOO_4LW_COMMANDS_WHITELIST: "*"
    healthcheck:
      test: ["CMD-SHELL", "zkServer.sh status"]
      interval: 5s
      timeout: 5s
      retries: 12
