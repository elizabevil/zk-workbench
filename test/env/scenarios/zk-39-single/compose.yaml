name: zkui-zk-39-single

services:
  zk:
    image: zookeeper:3.9
    container_name: zkui-zk-39-single
    ports:
      - "2181:2181"
    environment:
      ZOO_4LW_COMMANDS_WHITELIST: "*"
    healthcheck:
      test: ["CMD-SHELL", "zkServer.sh status"]
      interval: 5s
      timeout: 5s
      retries: 12
