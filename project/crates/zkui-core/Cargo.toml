[package]
name = "zkui-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "ZK UI 领域核心：连接、会话、缓存、命令执行与错误模型"

[dependencies]
async-http-proxy = { version = "1.2.5", features = ["runtime-tokio", "basic-auth"] }
dirs = "7.0.0"
keyring = "4.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
tokio-socks = "0.5.3"
toml = "1.1.8"
tracing = "0.1.44"
ts-rs = { version = "12.0.1", features = ["serde-compat"] }
zookeeper-client = { version = "0.11", features = ["tokio"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
zookeeper-client = { version = "0.11", features = ["tokio"] }
zookeeper-async = "5"
