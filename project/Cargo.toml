[workspace]
members = ["crates/zkui-core", "src-tauri"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
